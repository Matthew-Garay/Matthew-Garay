zó a hacerlo por su cuenta. Con el tiempo</text><text x="60.0" y="334.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >pasó a escribir sus propias herramientas para el trabajo de soporte: MG Toolkit para el</text><text x="60.0" y="358.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >mantenimiento de Windows, Office Installer para instalar Office con un comando e IP</text><text x="60.0" y="382.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >Inspector para revisar los equipos de una red.</text><text x="60.0" y="418.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >En su residencia profesional en la misma empresa desarrolló Precision HelpDesk, el sistema</text><text x="60.0" y="442.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >de tickets e inventario de TI que hoy está en prueba piloto. Lo hizo con React, Node.js y</text><text x="60.0" y="466.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >MySQL.</text></svg>