elvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >Windows, Office Installer para instalar Office con un comando e IP Inspector para revisar</text><text x="60.0" y="358.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >los equipos de una red.</text><text x="60.0" y="394.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >También desarrolla aplicaciones web con React, Node.js y MySQL. La más completa es Precision</text><text x="60.0" y="418.0" fill="#F0F0F0" font-size="15" font-weight="400" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" >HelpDesk, un sistema de tickets e inventario de TI que está en prueba piloto.</text></svg>