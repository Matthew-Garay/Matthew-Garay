<svg xmlns="http://www.w3.org/2000/svg" width="880" height="528" viewBox="0 0 880 528" role="img" aria-label="Acerca de Matthew Garay. Matthew Garay trabaja en el área de TI de RFV Truck Parts and Accessories desde septiembre de 2026. Atiende los reportes de los usuarios, da mantenimiento a las computadoras e impresoras y revisa la red local. Repara equipos de cómputo desde 2021, cuando empezó a hacerlo por su cuenta. Con el tiempo pasó a escribir sus propias herramientas para el trabajo de soporte: MG Toolkit para el mantenimiento de Windows, Office Installer para instalar Office con un comando e IP Inspector para revisar los equipos de una red. En su residencia profesional en la misma empresa desarrolló Precision HelpDesk, el sistema de tickets e inventario de TI que hoy está en prueba piloto. Lo hizo con React, Node.js y MySQL."><style></style><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532D"/><stop offset="1" stop-color="#0C2D48"/></linearGradient><linearGradient id="acv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient><clipPath id="acc"><rect x="32" y="74" width="816" height="422" rx="10"/></clipPath></defs><rect width="880" height="528" rx="12" fill="#121212"/><text x="32.0" y="50.0" fill="#FFFFFF" font-size="24" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-.5">Acerca de</text><rect x="32" y="74" width="816" height="422" rx="10" fill="url(#ac)"/><g clip-path="url(#acc)" opacity=".5"><circle cx="758" cy="114" r="120" fill="#F59B23" opacity=".35"/><circle cx="838" cy="204" r="110" fill="#4CB3FF" opacity=".35"/><circle cx="808" cy="476" r="90" fill="#B49BFF" opacity=".3"/></g><rect x="32" y="74" width="816" height="422" rx="10" fill="url(#acv)"/><text x="60.0" y="146.0" fill="#FFFFFF" font-size="44" font-weight="800" font-family="'Segoe