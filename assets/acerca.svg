<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-label="Acerca de Matthew Garay. Matthew Garay se dedica al soporte técnico y al desarrollo de software. Desde 2021 diagnostica, repara y da mantenimiento a computadoras, atiende a usuarios, configura impresoras y revisa redes locales. Escribe las herramientas que usa en ese trabajo: MG Toolkit para el mantenimiento de Windows, Office Installer para instalar Office con un comando e IP Inspector para revisar los equipos de una red. También desarrolla aplicaciones web con React, Node.js y MySQL. La más completa es Precision HelpDesk, un sistema de tickets e inventario de TI que está en prueba piloto."><style></style><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532D"/><stop offset="1" stop-color="#0C2D48"/></linearGradient><linearGradient id="acv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient><clipPath id="acc"><rect x="32" y="74" width="816" height="374" rx="10"/></clipPath></defs><rect width="880" height="480" rx="12" fill="#121212"/><text x="32.0" y="50.0" fill="#FFFFFF" font-size="24" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-.5">Acerca de</text><rect x="32" y="74" width="816" height="374" rx="10" fill="url(#ac)"/><g clip-path="url(#acc)" opacity=".5"><circle cx="758" cy="114" r="120" fill="#F59B23" opacity=".35"/><circle cx="838" cy="204" r="110" fill="#4CB3FF" opacity=".35"/><circle cx="808" cy="428" r="90" fill="#B49BFF" opacity=".3"/></g><rect x="32" y="74" width="816" height="374" rx="10" fill="url(#acv)"/><text x="60.0" y="146.0" fill="#FFFFFF" font-size="44" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-1.5">603</text><text x="60.0" y="172.0" fill="#