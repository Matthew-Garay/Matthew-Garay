<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img" aria-label="Acerca de Matthew Garay. Perfil híbrido en TI que combina el desarrollo de software, con una sólida base en soluciones web, y el soporte técnico. Tengo dominio en la gestión de bases de datos para análisis, así como en el mantenimiento integral de hardware y software. Me distingo por un enfoque resolutivo y paciente para encontrar la raíz de cada problema, y me apasiona simplificar la tecnología para que sea una herramienta de valor. Especialidad principal: Desarrollo web y soporte técnico de TI. Enfoque: encontrar la causa raíz y dejar la solución documentada."><style></style><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532D"/><stop offset="1" stop-color="#0C2D48"/></linearGradient><linearGradient id="acv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".45"/></linearGradient><clipPath id="acc"><rect x="32" y="74" width="816" height="362" rx="10"/></clipPath></defs><rect width="880" height="468" rx="12" fill="#121212"/><text x="32.0" y="50.0" fill="#FFFFFF" font-size="24" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-.5">Acerca de</text><rect x="32" y="74" width="816" height="362" rx="10" fill="url(#ac)"/><g clip-path="url(#acc)" opacity=".5"><circle cx="758" cy="114" r="120" fill="#F59B23" opacity=".35"/><circle cx="838" cy="204" r="110" fill="#4CB3FF" opacity=".35"/><circle cx="808" cy="416" r="90" fill="#B49BFF" opacity=".3"/></g><rect x="32" y="74" width="816" height="362" rx="10" fill="url(#acv)"/><text x="60.0" y="146.0" fill="#FFFFFF" font-size="44" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-1.5">651</text><text x="60.0" y="172.0" fill="#E0E0E0" font-size="14" f