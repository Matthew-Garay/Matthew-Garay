<svg xmlns="http://www.w3.org/2000/svg" width="880" height="438" viewBox="0 0 880 438" role="img" aria-label="Letra: fragmento real de Precision HelpDesk que bloquea el registro del inventario con SELECT FOR UPDATE antes de cambiar el stock"><style>.v{animation:canta 11.2s steps(1) infinite}@keyframes canta{0%{fill:#FFFFFF}12.50%{fill:#0B1020}100%{fill:#0B1020}}@media (prefers-reduced-motion:reduce){.v{animation:none;fill:#FFFFFF}}</style><defs></defs><rect width="880" height="438" fill="#121212"/><rect x="32" y="8" width="816" height="422" rx="10" fill="#4F7BE8"/><text x="60.0" y="58.0" fill="#FFFFFF" font-size="24" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" letter-spacing="-.5">Letra</text><text x="60.0" y="84.0" fill="#FFFFFF" font-size="13.5" font-weight="600" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" xml:space="preserve" opacity=".85">Precision HelpDesk  •  inventario-controller.js</text><text class="v" style="animation-delay:0.0s" x="60" y="142" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">await conn.beginTransaction();</text><text class="v" style="animation-delay:1.4s" x="60" y="178" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">const [[ins]] = await conn.query(</text><text class="v" style="animation-delay:2.8s" x="60" y="214" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">  &quot;SELECT id_insumo, nombre, stock, control_serie</text><text class="v" style="animation-delay:4.2s" x="60" y="250" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">   FROM insumo WHERE id_insumo = ? FOR UPDATE&quot;, [id_insumo]</text><text class="v" style="animation-delay:5.6s" x="60" y="286" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">);</text><text class="v" style="animation-delay:7.0s" x="60" y="322" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">if (!ins) { await conn.rollback(); return res.status(404); }</text><text class="v" style="animation-delay:8.4s" x="60" y="358" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">const stock_anterior = ins.stock ?? 0;</text><text class="v" style="animation-delay:9.8s" x="60" y="394" fill="#0B1020" font-size="19" font-weight="700" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" xml:space="preserve">const stock_nuevo    = stock_anterior + cantidad;</text></svg>